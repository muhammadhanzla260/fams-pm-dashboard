name: Jira reconcile sweep

# Safety net for dropped webhooks. Hits the deployed app's protected reconcile route.
on:
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC nightly
  workflow_dispatch: {}

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reconcile
        run: |
          curl -sS -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/reconcile?days=2" \
            --fail-with-body
